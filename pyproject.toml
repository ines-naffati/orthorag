[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orthorag"
version = "0.1.0"
description = "Grounded drafting of FDA 510(k) summaries for orthopedic implants with a local RAG pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Inès Naffati" }]
dependencies = [
    "requests>=2.31",
    "pypdf>=4.2",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "streamlit>=1.36",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orthorag = "orthorag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
